# Emotion recognition component.
#
# Intended purpose: infer the emotional state of a photographed subject from
# their face, for use in the generation pipeline and downstream consumers.

model:
  target: ldm.modules.emotion_recognition.EmotionRecognizer
  params:
    clip_version: "ViT-L/14"
    prompt_template: "a photograph of a {} person"
    taxonomy:
      - angry
      - disgusted
      - fearful
      - happy
      - sad
      - surprised
      - neutral
